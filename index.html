<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Vault — 120+ AI Tools</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#08090d;color:#fff;min-height:100vh}
header{text-align:center;padding:30px 18px;border-bottom:1px solid #20222b}
.logo{font-size:36px;font-weight:800}
.logo span{color:#7c5cff}
.sub{color:#9296a6;margin-top:8px}
.search{display:block;width:92%;max-width:680px;margin:22px auto 16px;padding:16px 18px;border:1px solid #292c38;border-radius:15px;background:#13151c;color:#fff;font-size:16px;outline:none}
.search:focus{border-color:#7c5cff}
.categories{display:flex;gap:8px;overflow-x:auto;padding:4px 4% 20px}
.categories::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:10px 15px;border-radius:22px;border:1px solid #292c38;background:#11131a;color:#bbb}
.cat.active{background:#7c5cff;color:#fff;border-color:#7c5cff}
.container{width:92%;max-width:1100px;margin:auto}
.count{color:#858998;margin:5px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.card{background:#12141b;border:1px solid #272a35;border-radius:18px;padding:19px;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#7c5cff}
.icon{font-size:30px;margin-bottom:12px}
.card h2{font-size:18px;margin-bottom:7px}
.card p{color:#8f93a3;font-size:14px;line-height:1.45;min-height:40px}
.tag{display:inline-block;margin-top:13px;padding:5px 9px;border-radius:8px;background:#20222c;color:#aaa;font-size:11px}
.actions{display:flex;gap:8px;margin-top:15px}
.open{flex:1;text-align:center;padding:10px;border-radius:10px;background:#7c5cff;color:white;text-decoration:none;font-weight:bold}
.fav{width:42px;border:1px solid #30333e;background:#181a22;color:#aaa;border-radius:10px;font-size:18px}
.fav.saved{color:#ffd43b}
.empty{text-align:center;padding:60px 10px;color:#777;display:none}
footer{text-align:center;padding:45px 20px;color:#555;font-size:13px}
</style>
</head>
<body>

<header>
<div class="logo">⚡ AI <span>Vault</span></div>
<p class="sub">Discover 120+ AI tools in one place</p>
</header>

<input id="search" class="search" placeholder="🔎 Search AI tools..." oninput="render()">

<div class="categories">
<button class="cat active" onclick="choose('All',this)">All</button>
<button class="cat" onclick="choose('Chat',this)">🤖 Chat</button>
<button class="cat" onclick="choose('Image',this)">🎨 Image</button>
<button class="cat" onclick="choose('Video',this)">🎬 Video</button>
<button class="cat" onclick="choose('Coding',this)">💻 Coding</button>
<button class="cat" onclick="choose('Writing',this)">✍️ Writing</button>
<button class="cat" onclick="choose('Automation',this)">⚙️ Automation</button>
</div>

<main class="container">
<div class="count" id="count"></div>
<div class="grid" id="tools"></div>
<div class="empty" id="empty">
<h2>😕 No tools found</h2>
<p>Try another search or category.</p>
</div>
</main>

<footer>⚡ AI Vault · 120+ AI tools</footer>

const links={
"ChatGPT":"https://chatgpt.com/",
"Claude":"https://claude.ai/",
"Gemini":"https://gemini.google.com/",
"Microsoft Copilot":"https://copilot.microsoft.com/",
"Perplexity":"https://www.perplexity.ai/",
"Canva":"https://www.canva.com/",
"Adobe Firefly":"https://firefly.adobe.com/",
"Midjourney":"https://www.midjourney.com/",
"Leonardo AI":"https://leonardo.ai/",
"Runway":"https://runwayml.com/",
"Pika":"https://pika.art/",
"Kling AI":"https://klingai.com/",
"Replit":"https://replit.com/",
"GitHub Copilot":"https://github.com/features/copilot",
"Cursor":"https://www.cursor.com/",
"Windsurf":"https://windsurf.com/",
"Lovable":"https://lovable.dev/",
"Grammarly":"https://www.grammarly.com/",
"QuillBot":"https://quillbot.com/",
"Zapier":"https://zapier.com/",
"Make":"https://www.make.com/",
"n8n":"https://n8n.io/",
"Taskade":"https://www.taskade.com/",
"Dify":"https://dify.ai/",
"IFTTT":"https://ifttt.com/"
};

let category="All";

function choose(c,b){
category=c;
document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));
b.classList.add("active");
render();
}

function render(){

const q=document.getElementById("search").value.toLowerCase().trim();
const box=document.getElementById("tools");
box.innerHTML="";

let visible=0;

tools.forEach((t,i)=>{

const [name,cat,icon,desc]=t;

if(category!=="All"&&cat!==category)return;

if(q&&!((name+" "+cat+" "+desc).toLowerCase().includes(q)))return;

visible++;

const saved=localStorage.getItem("fav_"+name)==="1";

const url=links[name]||
"https://www.google.com/search?q="+encodeURIComponent(name+" official");

box.innerHTML+=`
<div class="card">
<div class="icon">${icon}</div>
<h2>${name}</h2>
<p>${desc}</p>
<span class="tag">${cat}</span>
<div class="actions">
<a class="open" href="${url}" target="_blank" rel="noopener">Open ↗</a>
<button class="fav ${saved?"saved":""}" onclick="favorite('${name.replace(/'/g,"\\'")}',this)">
${saved?"★":"☆"}
</button>
</div>
</div>`;
});

document.getElementById("count").textContent=
visible+" tools found";

document.getElementById("empty").style.display=
visible?"none":"block";
}

function favorite(name,button){

const key="fav_"+name;
const saved=localStorage.getItem(key)==="1";

if(saved){
localStorage.removeItem(key);
button.classList.remove("saved");
button.textContent="☆";
}else{
localStorage.setItem(key,"1");
button.classList.add("saved");
button.textContent="★";
}
}

render();

</script>
